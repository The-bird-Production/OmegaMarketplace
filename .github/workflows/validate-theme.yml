name: Validate Theme

on:
  push:
    paths:
      - "themes/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get install -y unzip

    - name: Debug listing
      run: |
        echo "Current directory:"
        pwd
        echo "Listing themes/"
        ls -l themes/
        for theme in themes/*/; do
          echo "Checking theme: $theme"
          ls -l "$theme"
          echo "Content of style folder:"
          ls -l "$theme/style" || echo "No style folder"
        done

    - name: Validate Theme structure
      run: |
        mkdir -p validated_themes
        for theme in themes/*/; do
          if [ -d "$theme" ]; then
            echo "Validating $theme"
            if [ ! -f "$theme/theme.json" ] || [ ! -d "$theme/components" ] || [ ! -d "$theme/style" ] || [ ! -d "$theme/asset" ] || [ ! -f "$theme/style/style.css" ]; then
              echo "❌ Invalid structure for $theme"
              exit 1
            fi
            echo "✅ Structure OK for $theme"
            cp -r "$theme" validated_themes/
          fi
        done

    - name: Upload validated themes
      uses: actions/upload-artifact@v4
      with:
        name: validated-themes
        path: validated_themes/
