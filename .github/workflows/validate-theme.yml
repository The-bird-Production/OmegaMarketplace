name: Validate Theme

on:
  push:
    paths:
      - "themes/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get install -y unzip

    - name: Debug listing
      run: |
        echo "Current directory:"
        pwd
        echo "Listing themes/"
        ls -l themes/
        for theme in themes/*/; do
          echo "Checking theme: $theme"
          ls -l "$theme"
          echo "Content of style folder:"
          ls -l "$theme/style" || echo "No style folder"
        done

    - name: Validate Theme structure
      run: |
        mkdir -p validated_themes
        for theme in themes/*/; do
          if [ -d "$theme" ]; then
            echo "🔍 Validating $theme"
            MISSING=0

            if [ ! -f "$theme/theme.json" ]; then
              echo "❌ Missing: $theme/theme.json"
              MISSING=1
            fi
            if [ ! -d "$theme/components" ]; then
              echo "❌ Missing: $theme/components/"
              MISSING=1
            fi
            if [ ! -d "$theme/style" ]; then
              echo "❌ Missing: $theme/style/"
              MISSING=1
            fi
            if [ ! -f "$theme/style/style.css" ]; then
              echo "❌ Missing: $theme/style/style.css"
              MISSING=1
            fi
            if [ ! -d "$theme/asset" ]; then
              echo "❌ Missing: $theme/asset/"
              MISSING=1
            fi

            if [ "$MISSING" -eq 1 ]; then
              echo "❌ Invalid structure for $theme"
              exit 1
            else
              echo "✅ Structure OK for $theme"
              cp -r "$theme" validated_themes/
            fi
          fi
        done

    - name: Upload validated themes
      uses: actions/upload-artifact@v4
      with:
        name: validated-themes
        path: validated_themes/
